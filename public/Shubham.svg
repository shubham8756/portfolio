<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" />

  <!-- Avatar Silhouette / Geometric Representation -->
  <g transform="translate(0, 20)">
    <!-- Shoulders / Blazer -->
    <path d="M 80 380 Q 200 240 320 380 L 340 400 L 60 400 Z" fill="url(#suit)" />
    <!-- Inner Shirt -->
    <path d="M 155 300 L 245 300 L 230 400 L 170 400 Z" fill="url(#shirt)" />
    <!-- Tie -->
    <path d="M 190 310 L 210 310 L 215 380 L 200 400 L 185 380 Z" fill="#94a3b8" opacity="0.8" />
    
    <!-- Neck -->
    <path d="M 170 230 C 170 280, 230 280, 230 230 Z" fill="#e2e8f0" opacity="0.9" />
    
    <!-- Head -->
    <ellipse cx="200" cy="170" rx="65" ry="80" fill="#f1f5f9" />
    
    <!-- Hair -->
    <path d="M 130 160 C 130 90, 270 90, 270 160 C 250 110, 150 110, 130 160 Z" fill="#020617" />
    <!-- Beard -->
    <path d="M 140 180 C 140 250, 260 250, 260 180 C 240 230, 160 230, 140 180 Z" fill="#0f172a" opacity="0.95" />
  </g>

  <!-- Overlay text emblem -->
  <text x="200" y="375" text-anchor="middle" fill="#6366f1" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">SHUBHAM PANDEY</text>
</svg>
